  <rect x="404" y="580" width="452" height="84" rx="6" fill="#22262e" stroke="#3a4048"/>
  <text x="630" y="604" fill="#4fc3f7" font-size="13" font-weight="bold" text-anchor="middle">OBSERVABILITY</text>
  <text x="630" y="626" fill="#c3cbd6" font-size="11.5" text-anchor="middle">Structured JSON logs (severity) → Cloud Logging</text>
