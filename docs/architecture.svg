  <text x="1075" y="152" fill="#c3cbd6" font-size="12" text-anchor="middle">Execution Queue · Approvals</text>
  <text x="1075" y="172" fill="#c3cbd6" font-size="12" text-anchor="middle">Tool Gateway console · MCP tester</text>
  <text x="1075" y="192" fill="#c3cbd6" font-size="12" text-anchor="middle">Event Sources · Trace Explorer</text>
  <text x="1075" y="212" fill="#8a93a3" font-size="11" text-anchor="middle">Polling every 3s · dark ops UI</text>

  <!-- ================= FIRESTORE ================= -->
  <rect x="950" y="300" width="250" height="180" rx="6" fill="#22262e" stroke="#4285f4"/>
  <text x="1075" y="328" fill="#4285f4" font-size="14" font-weight="bold" text-anchor="middle">FIRESTORE</text>
  <text x="1075" y="354" fill="#c3cbd6" font-size="12" text-anchor="middle">executions/{id}</text>
  <text x="1075" y="376" fill="#8a93a3" font-size="11.5" text-anchor="middle">└ events/ (audit trace + actor)</text>
  <text x="1075" y="400" fill="#c3cbd6" font-size="12" text-anchor="middle">settings/integrations</text>
  <text x="1075" y="422" fill="#8a93a3" font-size="11.5" text-anchor="middle">(mail / CRM config)</text>
  <text x="1075" y="446" fill="#c3cbd6" font-size="12" text-anchor="middle">gateway_rate_limits</text>
  <text x="1075" y="468" fill="#8a93a3" font-size="11.5" text-anchor="middle">(shared quota via transactions)</text>

  <!-- ================= GCP identity ================= -->
  <rect x="950" y="520" width="250" height="80" rx="6" fill="#22262e" stroke="#8a93a3"/>
  <text x="1075" y="546" fill="#e8eaed" font-size="13" font-weight="bold" text-anchor="middle">GOOGLE OAUTH</text>
  <text x="1075" y="568" fill="#8a93a3" font-size="11" text-anchor="middle">Web Client ID · verified issuer/audience</text>
  <text x="1075" y="586" fill="#8a93a3" font-size="11" text-anchor="middle">ADMIN_EMAILS → admin role</text>

  <!-- ================= CI/CD note ================= -->
  <rect x="40" y="720" width="1160" height="110" rx="6" fill="#1e2127" stroke="#3a4048"/>
  <text x="620" y="748" fill="#e8eaed" font-size="13" font-weight="bold" text-anchor="middle">DEPLOYMENT &amp; VERIFICATION</text>
  <text x="620" y="772" fill="#c3cbd6" font-size="12" text-anchor="middle">Multi-stage Dockerfile (non-root) · Artifact Registry · cloudbuild.yaml · scripts/deploy-cloud-run.sh · scripts/verify-container.sh</text>
  <text x="620" y="794" fill="#8a93a3" font-size="12" text-anchor="middle">https://acp-backend-627792456859.us-central1.run.app · e2e acceptance test: scripts/e2e_acceptance_test.py · ADC everywhere, zero credentials in image/git</text>

  <!-- ================= ARROWS ================= -->
  <!-- Operator -> frontend -->
  <line x1="290" y1="146" x2="943" y2="146" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrow-cyan)" marker-start="url(#arrow-cyan)"/>
  <text x="617" y="138" fill="#8a93a3" font-size="11" text-anchor="middle">sign-in + manage executions</text>

  <!-- Frontend -> Cloud Run -->
  <line x1="1035" y1="220" x2="887" y2="160" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="985" y="182" fill="#8a93a3" font-size="11" text-anchor="middle">REST + Bearer token</text>

  <!-- Event sources -> API layer -->
  <line x1="290" y1="300" x2="373" y2="200" stroke="#f39b4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="238" fill="#8a93a3" font-size="11" text-anchor="middle">auto-create executions</text>

  <!-- API -> auth -->
  <line x1="511" y1="210" x2="511" y2="228" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API -> approval gate -->
  <line x1="748" y1="210" x2="748" y2="228" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- approval -> runner -->
  <path d="M 700 290 L 700 320 L 580 320 L 580 382" fill="none" stroke="#f39b4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="338" fill="#8a93a3" font-size="10.5" text-anchor="middle">on APPROVED</text>

  <!-- runner -> vertex -->
  <line x1="511" y1="458" x2="511" y2="486" stroke="#34a86a" stroke-width="1.5" marker-end="url(#arrow-cyan)" marker-start="url(#arrow-cyan)"/>

  <!-- runner -> gateway -->
  <line x1="619" y1="420" x2="641" y2="420" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="410" fill="#8a93a3" font-size="10.5" text-anchor="middle">tools</text>

  <!-- gateway -> mcp -->
  <line x1="748" y1="458" x2="748" y2="486" stroke="#e05d5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- backend -> firestore -->
  <line x1="887" y1="370" x2="950" y2="380" stroke="#4285f4" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="918" y="362" fill="#8a93a3" font-size="10.5" text-anchor="middle">state + audit</text>

  <!-- backend -> oauth -->
  <line x1="887" y1="260" x2="950" y2="540" stroke="#8a93a3" stroke-width="0" />
  <path d="M 830 290 C 900 340 950 480 1020 520" fill="none" stroke="#8a93a3" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="985" y="470" fill="#8a93a3" font-size="10.5" text-anchor="middle">token verify</text>
