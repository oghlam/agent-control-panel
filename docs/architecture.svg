<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a3"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
  </defs>

  <rect width="1240" height="860" fill="#1a1d23"/>
  <text x="620" y="42" fill="#e8eaed" font-size="24" font-weight="bold" text-anchor="middle">AGENT CONTROL PLANE — ARCHITECTURE</text>
  <text x="620" y="64" fill="#8a93a3" font-size="13" text-anchor="middle">All Things Agentic Hackathon 2026 · Track: Taskmaster · Gemini 3.5 Flash + Google ADK on Google Cloud</text>

  <!-- ================= USERS ================= -->
  <rect x="40" y="100" width="250" height="92" rx="6" fill="#22262e" stroke="#4fc3f7" stroke-width="1"/>
  <text x="165" y="128" fill="#4fc3f7" font-size="14" font-weight="bold" text-anchor="middle">HUMAN OPERATOR</text>
  <text x="165" y="150" fill="#c3cbd6" font-size="12" text-anchor="middle">Google Sign-In (OAuth ID token)</text>
  <text x="165" y="170" fill="#c3cbd6" font-size="12" text-anchor="middle">Create / approve executions</text>

  <!-- ================= EVENT SOURCES ================= -->
  <rect x="40" y="240" width="250" height="120" rx="6" fill="#22262e" stroke="#f39b4a" stroke-width="1"/>
