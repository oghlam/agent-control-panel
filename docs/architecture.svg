  <text x="165" y="290" fill="#c3cbd6" font-size="12" text-anchor="middle">Inbound Email Webhook</text>
  <text x="165" y="310" fill="#c3cbd6" font-size="12" text-anchor="middle">HubSpot Webhook</text>
  <text x="165" y="330" fill="#c3cbd6" font-size="12" text-anchor="middle">IMAP Polling Daemon</text>

  <!-- ================= CLOUD RUN BOX ================= -->
  <rect x="380" y="90" width="500" height="600" rx="8" fill="#20242b" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="630" y="118" fill="#e8eaed" font-size="15" font-weight="bold" text-anchor="middle">CLOUD RUN — FastAPI Backend (Python 3.12)</text>

  <!-- API layer -->
  <rect x="404" y="140" width="452" height="70" rx="6" fill="#22262e" stroke="#3a4048"/>
  <text x="630" y="164" fill="#4fc3f7" font-size="13" font-weight="bold" text-anchor="middle">API LAYER</text>
  <text x="630" y="186" fill="#c3cbd6" font-size="11.5" text-anchor="middle">Executions CRUD · Cursor Pagination · Webhooks · Integrations Config · Diagnostics</text>

  <!-- Auth -->
  <rect x="404" y="228" width="215" height="62" rx="6" fill="#22262e" stroke="#3a4048"/>
  <text x="511" y="252" fill="#e8eaed" font-size="13" font-weight="bold" text-anchor="middle">AUTH MODULE</text>
  <text x="511" y="272" fill="#8a93a3" font-size="11" text-anchor="middle">Google ID token verify · RBAC roles</text>

  <!-- Approval gate -->
  <rect x="641" y="228" width="215" height="62" rx="6" fill="#22262e" stroke="#f39b4a"/>
  <text x="748" y="252" fill="#f39b4a" font-size="13" font-weight="bold" text-anchor="middle">APPROVAL GATE</text>
  <text x="748" y="272" fill="#8a93a3" font-size="11" text-anchor="middle">Human-in-the-loop (optional)</text>

