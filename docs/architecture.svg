  <text x="511" y="426" fill="#c3cbd6" font-size="11" text-anchor="middle">Google ADK 2.7.1</text>
  <text x="511" y="444" fill="#c3cbd6" font-size="11" text-anchor="middle">Agent · Runner · SessionService</text>

  <!-- Vertex AI -->
  <rect x="404" y="486" width="215" height="60" rx="6" fill="#22262e" stroke="#34a86a"/>
  <text x="511" y="508" fill="#e8eaed" font-size="13" font-weight="bold" text-anchor="middle">VERTEX AI</text>
  <text x="511" y="528" fill="#8a93a3" font-size="11" text-anchor="middle">Gemini 3.5 Flash (locked model)</text>

