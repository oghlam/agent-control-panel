  <rect x="641" y="382" width="215" height="76" rx="6" fill="#22262e" stroke="#e05d5d"/>
  <text x="748" y="406" fill="#e05d5d" font-size="13" font-weight="bold" text-anchor="middle">TOOL GATEWAY</text>
  <text x="748" y="426" fill="#c3cbd6" font-size="11" text-anchor="middle">RBAC · Risk levels (LOW→CRITICAL)</text>
  <text x="748" y="444" fill="#c3cbd6" font-size="11" text-anchor="middle">Sliding-window rate limits</text>

  <!-- MCP -->
  <rect x="641" y="486" width="215" height="60" rx="6" fill="#22262e" stroke="#e05d5d"/>
  <text x="748" y="508" fill="#e8eaed" font-size="13" font-weight="bold" text-anchor="middle">MCP SERVERS</text>
  <text x="748" y="528" fill="#8a93a3" font-size="11" text-anchor="middle">inventory · crm · email · gcp (JSON-RPC)</text>

